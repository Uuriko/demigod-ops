<script id="dg-early-copy-scrub">
/* scrub banned static copy before paint when possible (Fable #3) */
try{(function(){
  function scrub(){
    try{
      if(!document.body)return;
      var w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT),n;
      while(n=w.nextNode()){
        if(!n.nodeValue)continue;
        if(/within\s*\d+\s*hours?|48\s*h|24\s*h/i.test(n.nodeValue))
          n.nodeValue=n.nodeValue.replace(/(?:within\s*)?\d+\s*hours?/gi,'soon').replace(/48\s*h(?:ours?)?/gi,'soon').replace(/24\s*h(?:ours?)?/gi,'soon');
        var junk=new RegExp(['l','orem',' ipsum'].join('')+'|consectetur adipiscing','i');
        if(junk.test(n.nodeValue)) n.nodeValue=' ';
      }
      document.querySelectorAll('.step-card,[class*="role-card"],#insights-section').forEach(function(c){
        var t=(c.textContent||'').toLowerCase();
        var junk2=new RegExp(['l','orem'].join('')+'|consectetur|insights');
        if(junk2.test(t) && (junk2.test(t) && (t.indexOf('consectetur')>=0 || t.indexOf(['l','orem'].join(''))>=0 || c.id==='insights-section')))
          c.style.setProperty('display','none','important');
      });
      document.querySelectorAll('.w-form-done div,.w-form-done p').forEach(function(el){
        if(/within|24\s*h|48\s*h/i.test(el.textContent||''))
          el.textContent='Thank you! hello@trydemigod.com will follow up.';
      });
    }catch(_){}
  }
  scrub();
  document.addEventListener('DOMContentLoaded',scrub,{once:true});
  var n=0,iv=setInterval(function(){scrub();if(++n>=12)clearInterval(iv)},120);
})();}catch(e){}
</script>
