<script id="dg-contact-scrub">
try{(function(){

  var VOL=/\b3[\s–-]5\b(?:\s+(?:highly\s+aligned,?\s+)?(?:pre-vetted\s+)?(?:curated\s+)?(?:SF\s+)?(?:candidates?|finalists?|profiles?))?/ig;

  var GOOD_TITLE='Demigod • Tech-Matched SF Startup Talent';
  var INTROS=[

    [/Humans match you to SF startups that fit\.?/gi,'Humans propose SF startups only after both sides approve.'],

    [/90-?\s*day replacement guarantee/gi,'90-day outcome focus (replacement policy pending)'],
    [/SF BAY AREA STARTUP MATCHING/gi,'SF · TECH-MATCHED'],
    [/Access to pre-vetted SF talent/gi,'Human-reviewed SF Bay matches'],
    [/Dedicated talent partner/gi,'A human reads every brief'],
    [/\bpre-vetted\b/gi,'human-reviewed'],
    [new RegExp('\\b(?:within\\s+)?' + '4' + '8' + '\\s*h(?:ours?)?\\b','gi'),'potter@trydemigod.com will follow up'],
    [new RegExp('\\b' + '2' + '4' + '\\s*h(?:ours?)?\\b','gi'),'potter@trydemigod.com will follow up'],

  function fixText(s){

  function needsFix(v){

        if(BAD.test(href)){ BAD.lastIndex=0; a.setAttribute(a.tagName==='FORM'?'action':'href',href.replace(BAD,GOOD)); }
        if(a.tagName!=='FORM' && (BAD.test(a.textContent||'')||VOL.test(a.textContent||''))){

        }
      });
      document.querySelectorAll('[data-props-link]').forEach(function(el){

        if(BAD.test(v)){ BAD.lastIndex=0; el.setAttribute('data-props-link',v.replace(BAD,GOOD)); }
      });
      document.querySelectorAll('[href],[title],[aria-label],[data-w-id],[data-link],[action]').forEach(function(el){

          var v=el.getAttribute(attr); if(!v||!(BAD.test(v)||VOL.test(v))){ BAD.lastIndex=0; VOL.lastIndex=0; return; }

<script>
document.addEventListener('DOMContentLoaded',function(){

  setTimeout(function(){
    if(document.body&&!document.body.classList.contains('dg-ready')){
      function scrubPromiseCopy(){
        document.querySelectorAll('a,button,h1,h2,h3,h4,p,li,span').forEach(function(el){
          if(el.children&&el.children.length>1)return;
          var t=(el.textContent||'').trim();
          if(!t||t.length>180)return;
          if(/^(?:find|hire)\s+(?:sf\s+)?(?:engineering\s+)?talent[.!]?$/i.test(t)){
            el.textContent="I'm hiring";
            if(el.matches('a'))el.setAttribute('href','/?wiz=startup');
          }else if(/(?:3\s*(?:[–—-]|to)\s*5|three\s+to\s+five)\s+(?:[\w-]+\s+){0,3}(?:candidates?|matches?|profiles?|finalists?)/i.test(t)){
            el.textContent='Meet curated matches';
          }else if(/(?:90\s*[–—-]?\s*day\s+)?replacement\s+(?:guarantee|promise|warranty|assurance)|90\s*[–—-]?\s*day\s+(?:guarantee|warranty|assurance)/i.test(t)){
            el.textContent='90-day outcome focus';
          }
        });
      }
      function labelPair(root){
        if(!root)return;
        var links=root.querySelectorAll('a');
        ['I\'m hiring','Find a job'].forEach(function(label,i){
          var link=links[i]; if(!link)return;
          var text=link.querySelector('.btn-label,.button_label')||link;
          text.textContent=label;
          link.setAttribute('data-dg-cta',i===0?'hire':'talent');
          link.setAttribute('href',i===0?'/?wiz=startup':'/?wiz=engineer');
        });
      }
      labelPair(document.querySelector('.hero-actions'));
      labelPair(document.querySelector('.nav_right'));
      scrubPromiseCopy();
      document.body.classList.add('dg-head-fallback','dg-ready');
      document.body.setAttribute('data-dg-ready','1');
    }
  },1800);
});</script>
