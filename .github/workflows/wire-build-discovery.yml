name: wire-build-discovery

on:
  push:
    branches: [feat/build-discovery]
    paths:
      - 'dasha-build-discovery.mjs'
      - 'dasha-build-discovery.test.mjs'
      - 'scripts/wire-build-discovery.mjs'
      - '.github/workflows/wire-build-discovery.yml'

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/build-discovery
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node dasha-build-discovery.test.mjs
      - run: node scripts/wire-build-discovery.mjs
      - name: Commit wiring
        run: |
          if git diff --quiet -- dasha-lobby-worker.mjs; then
            echo "already wired"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add dasha-lobby-worker.mjs
          git commit -m "Wire Build discovery into production Worker"
          git push
