name: Demigod source verify

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: demigod-source-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Syntax
        run: |
          node --check demigod-verify-source.mjs
          node --check demigod-verify-live.mjs
          node --check demigod-webhook-url.mjs
          node --check demigod-foot-smoke.mjs
          node --check demigod-control.mjs
      - name: Portability
        run: node --test demigod-portability.test.mjs
      - name: Product page contracts
        run: node --test pages-contract.test.mjs
      - name: Source contract
        run: node demigod-verify-source.mjs
      - name: Live contract library
        run: node demigod-live-lib.test.mjs
      - name: DASHA CMC application packet
        run: bash scripts/verify.sh
