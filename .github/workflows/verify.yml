name: verify

# Why this exists: three agents (Claude, Grok, Codex) edit one working tree concurrently, so a
# local `verify-all` run competes with peers rewriting the same files mid-run. On 2026-07-30 it
# reported failed:0, then 1, then 4 with no code change between two of those runs. CI is the only
# place a gate result is trustworthy: isolated checkout, no concurrent writer, no TTY.
#
# The no-TTY part is not incidental. A test here asserted on colourised `util.inspect` output and
# so passed under `node --test` but failed under `node file.test.mjs`. CI has no TTY, which makes
# that whole class fail loudly instead of depending on how someone happened to invoke the suite.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: tracked test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # No `npm ci`: every tracked test imports only Node builtins and relative paths (verified
      # 2026-07-30). If a third-party import is ever added, this step starts failing and the fix
      # is to add the install back — not to silence it.
      - name: Run tracked tests
        run: |
          files=$(git ls-files '*.test.mjs')
          count=$(echo "$files" | grep -c . || true)
          echo "running $count tracked test files"
          test "$count" -gt 0 || { echo "::error::no test files found — a vacuous green"; exit 1; }
          node --test --test-concurrency=4 $files

      - name: Import integrity
        run: node demigod-import-integrity.mjs

  gate-coverage:
    name: gate coverage (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # demigod-verify-all.mjs names 72 gates. Locally 26 of them are untracked, so they exist on
      # one laptop and nowhere else — CI cannot run what was never committed. This job makes that
      # gap visible on every push instead of leaving it as an advisory line nobody reads.
      # Advisory for now, because failing from day one would train everyone to ignore it. Flip
      # `continue-on-error` off once the gates are tracked.
      - name: Report gates missing from the checkout
        continue-on-error: true
        run: |
          node -e '
            const fs = require("fs");
            const src = fs.readFileSync("demigod-verify-all.mjs", "utf8");
            const block = src.slice(src.indexOf("const steps = ["));
            const names = [...block.matchAll(/\[\x27([\w.-]+\.mjs)\x27/g)].map((m) => m[1]);
            const unique = [...new Set(names)];
            const missing = unique.filter((f) => !fs.existsSync(f));
            console.log(`verify-all references ${unique.length} gates; ${missing.length} are absent from this checkout`);
            for (const f of missing) console.log(`::warning file=demigod-verify-all.mjs::gate not committed: ${f}`);
            if (missing.length) process.exitCode = 1;
          '
