<script>(function(){
var path=location.pathname;
var q=new URLSearchParams(location.search);
var pageParam=(q.get('p')||q.get('page')||'').toLowerCase();
/* Product HTML is embedded in catbox .js as var html="..."; we fetch+parse instead of document.write (race-safe). */
var cdn={
  hire:'https://files.catbox.moe/8b5k5y.js',
  talent:'https://files.catbox.moe/5y826r.js',
  how:'https://files.catbox.moe/lnwvmd.js',
  pricing:'https://files.catbox.moe/h08frw.js',
  pilot:'https://files.catbox.moe/zvixjv.js',
  proof:'https://files.catbox.moe/53e4nt.js',
  faq:'https://files.catbox.moe/ygvf2h.js',
  compare:'https://files.catbox.moe/z1t56j.js'
};
function productFallback(page){
  try{
    if(document.body) document.body.style.setProperty('display','block','important');
    if(document.getElementById('dg-product-fallback')) return;
    var el=document.createElement('main');
    el.id='dg-product-fallback';
    el.style.cssText='max-width:36rem;margin:4rem auto;padding:1.5rem;color:#F5F0E6;font-family:system-ui,sans-serif;background:#0A0A0A';
    el.innerHTML='<h1 style="color:#C9A84C;font-size:1.4rem">Page temporarily unavailable</h1><p style="color:#A8A29E;line-height:1.5">We could not load the <strong>'+String(page||'')+'</strong> page. <a href="/" style="color:#C9A84C">Back to home</a> · <a href="mailto:hello@trydemigod.com" style="color:#C9A84C">hello@trydemigod.com</a></p>';
    document.body.insertBefore(el, document.body.firstChild);
  }catch(e){}
}
function extractProductHtml(js){
  if(!js) return null;
  // var html = "....";
  var m = js.match(/var\s+html\s*=\s*"([\s\S]*?)";\s*\n\s*document\.open/);
  if(!m) m = js.match(/var\s+html\s*=\s*"([\s\S]*?)";\s*document\.open/);
  if(!m) return null;
  try {
    return JSON.parse('"' + m[1] + '"');
  } catch (e) {
    try {
      return m[1]
        .replace(/\\u([0-9a-fA-F]{4})/g, function(_, h){ return String.fromCharCode(parseInt(h, 16)); })
        .replace(/\\n/g, '\n')
        .replace(/\\r/g, '\r')
        .replace(/\\t/g, '\t')
        .replace(/\\"/g, '"')
        .replace(/\\\\/g, '\\');
    } catch (e2) {
      return null;
    }
  }
}
function applyProductHtml(html, page){
  if(!html){ productFallback(page); return; }
  try{
    if(document.body) document.body.style.setProperty('display','block','important');
    var doc = new DOMParser().parseFromString(html, 'text/html');
    if(!doc || !doc.documentElement){ productFallback(page); return; }
    document.title = doc.title || document.title;
    // Replace documentElement without document.write (avoids parser race with footer foot-core)
    var next = document.importNode(doc.documentElement, true);
    document.replaceChild(next, document.documentElement);
    // Ensure body visible after swap
    try{
      if(document.body){
        document.body.style.setProperty('display','block','important');
        document.body.style.setProperty('visibility','visible','important');
      }
    }catch(e){}
  }catch(e){
    productFallback(page);
  }
}
function loadProduct(page){
  var local=/^(localhost|127\.0\.0\.1)$/i.test(location.hostname);
  if(local){location.replace('/demigod-pages/'+page+'.html');return;}
  var src=cdn[page];
  if(!src){productFallback(page);return;}
  // loading shell (non-destructive)
  try{
    if(document.body && !document.getElementById('dg-product-loading')){
      var ld=document.createElement('p');
      ld.id='dg-product-loading';
      ld.style.cssText='position:fixed;top:12px;right:12px;z-index:9999;color:#C9A84C;font:600 13px system-ui;background:rgba(10,10,10,.9);padding:8px 12px;border:1px solid rgba(201,168,76,.35);border-radius:8px';
      ld.textContent='Loading '+page+'…';
      document.body.appendChild(ld);
    }
  }catch(e){}
  var done=false;
  var t=setTimeout(function(){ if(!done) productFallback(page); }, 10000);
  fetch(src,{cache:'no-store',credentials:'omit'})
    .then(function(r){ if(!r.ok) throw new Error('http '+r.status); return r.text(); })
    .then(function(js){
      done=true; clearTimeout(t);
      var html=extractProductHtml(js);
      if(!html){ productFallback(page); return; }
      applyProductHtml(html, page);
    })
    .catch(function(){
      done=true; clearTimeout(t);
      productFallback(page);
    });
}
if(/^\/legal\/?$/i.test(path)&&!/#privacy|#terms/.test(location.hash))location.replace('/#legal');
else if(/^\/partnerships?\/?$/i.test(path)&&location.hash!=='#partnerships')location.replace('/#partnerships');
else if(/^\/events\/?$/i.test(path))location.replace('https://files.catbox.moe/m22wy3.html');
else if(pageParam&&cdn[pageParam])loadProduct(pageParam);
else if(/^\/(hire|talent|pricing|pilot|proof|how|faq|compare)\/?$/i.test(path)){
  var m=path.match(/^\/(hire|talent|pricing|pilot|proof|how|faq|compare)/i);
  loadProduct((m&&m[1]||'how').toLowerCase());
}
})();</script>

<script>
/*dg-honesty+product-nav v30 — debounced, max 6 runs, NO MutationObserver thrash
  Prior v28/v29 could freeze the page: MO → walk whole DOM → text mutations → MO again. */
(function () {
  var runs = 0;
  var maxRuns = 6;
  var t = null;
  function scrub() {
    if (runs >= maxRuns) return;
    runs++;
    try {
      var walk = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
      var n;
      var re = /(\b48\s*h(?:ours?)?\b|\bwithin\s*48\b|\bSLA\b)/i;
      while ((n = walk.nextNode())) {
        if (re.test(n.nodeValue || '')) {
          n.nodeValue = (n.nodeValue || '')
            .replace(/\bwithin\s*48\s*h(?:ours?)?\b/gi, 'hello@trydemigod.com will follow up')
            .replace(/\b48\s*h(?:ours?)?\b/gi, 'soon')
            .replace(/\bSLA\b/g, 'follow-up');
        }
      }
    } catch (e) {}
  }
  function schedule() {
    if (t) clearTimeout(t);
    t = setTimeout(scrub, 400);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', schedule);
  else schedule();
  [800, 2000, 4500].forEach(function (ms) {
    setTimeout(schedule, ms);
  });
})();
</script>

<script id="dg-body-display-guard">
/* last-line defense: never allow blank site via body display:none */
(function () {
  var n = 0;
  var id = setInterval(function () {
    n++;
    try {
      var b = document.body,
        d = document.documentElement;
      if (!b) return;
      if (getComputedStyle(b).display === 'none' || (b.getAttribute('style') || '').indexOf('display: none') >= 0) {
        b.style.setProperty('display', 'block', 'important');
        b.style.setProperty('visibility', 'visible', 'important');
      }
      if (d && getComputedStyle(d).display === 'none') d.style.setProperty('display', 'block', 'important');
    } catch (e) {}
    if (n >= 40) clearInterval(id);
  }, 250);
})();
</script>
