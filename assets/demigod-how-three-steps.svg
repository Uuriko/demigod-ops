<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 214" width="100%" role="img"
     aria-label="Three steps: software compares the facts and nothing is messaged yet; a human decides what to propose and never auto-introduces; both sides approve privately before any introduction.">
  <title>How a Demigod match works — three steps, gated on mutual yes</title>
  <defs>
    <marker id="dg-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#7f978c"/>
    </marker>
  </defs>

  <!-- Stacked, not side-by-side. A 3-up horizontal layout scaled to a 360px phone renders its
       11.5px type at about 6.5 effective pixels — verified by rendering it, not assumed. This
       site is mobile-first, so one vertical asset that is legible everywhere beats two variants
       behind a media query. Copy is shorter than the /how prose on purpose: the diagram carries
       the sequence and the gate, the page carries the detail. Nothing here claims anything /how
       does not already say. -->
  <g font-family="ui-sans-serif, system-ui, sans-serif">

    <!-- 1 -->
    <rect x="1" y="14" width="338" height="52" rx="9" fill="#0d1f17" stroke="#1e3428"/>
    <circle cx="24" cy="34" r="9" fill="#a6ffcb"/>
    <text x="24" y="38" text-anchor="middle" font-size="11" font-weight="700" fill="#07150f">1</text>
    <text x="41" y="38" font-size="13" font-weight="600" fill="#a6ffcb">Software compares</text>
    <text x="41" y="56" font-size="11.5" fill="#c9d6cf">Ranks role goals, skills, location, pay.</text>
    <line x1="24" y1="70" x2="24" y2="82" stroke="#7f978c" stroke-width="1.5" marker-end="url(#dg-arrow)"/>

    <!-- 2 -->
    <rect x="1" y="88" width="338" height="52" rx="9" fill="#0d1f17" stroke="#1e3428"/>
    <circle cx="24" cy="108" r="9" fill="#a6ffcb"/>
    <text x="24" y="112" text-anchor="middle" font-size="11" font-weight="700" fill="#07150f">2</text>
    <text x="41" y="112" font-size="13" font-weight="600" fill="#a6ffcb">A human decides</text>
    <text x="41" y="130" font-size="11.5" fill="#c9d6cf">A person picks what to propose.</text>
    <line x1="24" y1="144" x2="24" y2="156" stroke="#7f978c" stroke-width="1.5" marker-end="url(#dg-arrow)"/>

    <!-- 3 — the gate, given the accent border because it is the product -->
    <rect x="1" y="162" width="338" height="52" rx="9" fill="#0d1f17" stroke="#a6ffcb"/>
    <circle cx="24" cy="182" r="9" fill="#a6ffcb"/>
    <text x="24" y="186" text-anchor="middle" font-size="11" font-weight="700" fill="#07150f">3</text>
    <text x="41" y="186" font-size="13" font-weight="600" fill="#a6ffcb">Mutual yes</text>
    <text x="41" y="204" font-size="11.5" fill="#c9d6cf">Both approve before any intro.</text>

    <!-- Steps 1-2 are explicitly silent. That is the claim doing the most work on /how, so it
         gets its own line rather than being left to the prose. -->
    <text x="1" y="9" font-size="10.5" fill="#7f978c">nothing is sent until step 3</text>
    <text x="339" y="9" text-anchor="end" font-size="10.5" fill="#a6ffcb">identity private until both say yes</text>
  </g>
</svg>
