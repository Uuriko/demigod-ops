<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img"
     aria-label="Dasha Labs. Write the call before the chart writes the story. A free tool, no wallet connection.">
  <title>Dasha Labs — write the call before the chart writes the story</title>

  <!-- Deliberately carries no ticker, no price, no mint address and nothing resembling real market
       data. A social card is the most screenshot-and-decontextualised artifact a site produces, so
       it must not make a claim the page itself would not make. The brief withholds token claims
       until project identity is confirmed. -->

  <rect width="1200" height="630" fill="#08090b"/>
  <rect x="0" y="0" width="1200" height="6" fill="#d8ff52"/>

  <g font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">
    <text x="80" y="112" font-size="26" font-weight="800" fill="#d8ff52" letter-spacing="4">DASHA LABS</text>

    <!-- Type sized for a thumbnail: X renders these small, so the headline is the only thing that
         has to survive at 30% scale. -->
    <text x="80" y="232" font-size="76" font-weight="800" fill="#f4f5f7">Write the call</text>
    <text x="80" y="322" font-size="76" font-weight="800" fill="#f4f5f7"><tspan fill="#d8ff52">before</tspan> the chart</text>
    <text x="80" y="412" font-size="76" font-weight="800" fill="#f4f5f7">writes the story.</text>

    <!-- The invalidation line: the one idea the product is about, drawn rather than described. -->
    <line x1="80" y1="470" x2="1120" y2="470" stroke="#ffb4a8" stroke-width="2" stroke-dasharray="9 7"/>
    <text x="80" y="458" font-size="22" fill="#ffb4a8">invalidation, written first</text>

    <text x="80" y="536" font-size="30" font-weight="700" fill="#a9afbc">Thesis · invalidation · horizon — timestamped and fingerprinted.</text>
    <text x="80" y="580" font-size="26" fill="#a9afbc">Free tool · no wallet connection · not financial advice</text>
  </g>
</svg>
