<style>
  /* The lobby, on its own page and at full size. */
  #dasha-lobby-page{--ink:#070608;--paper:#f4eddb;--acid:#dfff00;--hot:#ff3b81;--violet:#7c4dff;
    --line:rgba(244,237,219,.18);--muted:rgba(244,237,219,.62);
    display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;
    background:var(--ink);color:var(--paper);font:16px/1.5 Arial,Helvetica,sans-serif;
    background-image:radial-gradient(circle at 84% 2%,rgba(124,77,255,.28),transparent 30rem),
                     radial-gradient(circle at 4% 78%,rgba(255,59,129,.16),transparent 26rem)}
  #dasha-lobby-page *{box-sizing:border-box}
  #dasha-lobby-page a{color:inherit}
  .skip-link{position:absolute;left:-9999px;top:0;z-index:100;padding:12px 16px;background:var(--acid);color:var(--ink)!important;font-weight:900;text-decoration:none}
  .skip-link:focus{left:12px;top:12px;outline:3px solid var(--paper);outline-offset:2px}
  /* main is the flex child so .lp-hold{flex:1} still fills under the header. */
  #dasha-lobby-page > main{flex:1 1 auto;display:flex;flex-direction:column;min-height:0}

  /* Header: one way back, one room name. */
  .lp-top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    padding:12px clamp(14px,3vw,26px);border-bottom:1px solid var(--line);
    background:rgba(7,6,8,.92);backdrop-filter:blur(8px)}
  .lp-back{font-size:14px;font-weight:900;text-decoration:none;min-height:44px;display:inline-flex;align-items:center;gap:7px}
  .lp-id{display:flex;align-items:baseline;gap:9px;margin-right:auto;min-width:0}
  .lp-id h1{margin:0;font-size:19px;font-weight:950;letter-spacing:-.03em}
  .lp-id h1 span{color:var(--acid)}
  .lp-room{margin:0;width:100%;font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}

  /* The composer, on a page where it is the only thing to type into. The counters sit inline with
     their fields rather than claiming their own rows: three rows of chrome under a chat is the
     homepage layout leaking onto a page that has room to be simpler. */
  #dasha-lobby .lobby-field{gap:2px}
  #dasha-lobby .lobby-count{font-size:11px;color:var(--muted);text-align:right}

  /* The client ships unstyled on purpose: its host supplies the CSS. On the homepage that host was
     dasha-landing.html, so lifting the chat onto its own page without these rules produced raw
     browser inputs under a finished header — which is what the first render looked like, and is why
     this is copied rather than reinvented. The two section-level rules (.lobby-sec, .lobby-lede)
     are deliberately left behind: they position a chat inside a homepage section, and this page is
     not one. Everything below is the client's own vocabulary and belongs with the client; if it ever
     starts shipping its own stylesheet, delete this block. */
  .lobby-pin{font-size:13px;line-height:1.5;color:var(--muted)}
  .lobby-pin strong{color:var(--acid);letter-spacing:.08em;text-transform:uppercase}
  .lobby-mint{font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--paper)}
  .lobby-status{margin:0;font-size:14px;font-weight:700;color:var(--muted)}
  .lobby-status[data-kind=ok]{color:var(--acid)}
  .lobby-status[data-kind=bad]{color:var(--hot)}
  .lobby-status[data-kind=warn]{color:var(--hot)}
  .lobby-log{min-height:200px;max-height:320px;overflow:auto;padding:12px;border:1px solid var(--line);border-radius:10px;background:rgba(0,0,0,.35);display:flex;flex-direction:column;gap:8px}
  .lobby-line{display:grid;gap:2px;font-size:15px;line-height:1.4}
  .lobby-meta{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .lobby-chat .lobby-meta{color:var(--acid)}
  .lobby-pin .lobby-meta,.lobby-line.lobby-pin .lobby-meta{color:var(--hot)}
  .lobby-body{overflow-wrap:anywhere;color:var(--paper)}
  .lobby-form{display:grid;grid-template-columns:minmax(100px,120px) 1fr auto;gap:8px;align-items:start}
  .lobby-field{display:grid;gap:4px;min-width:0}
  .lobby-field-text{min-width:0}
  .lobby-form input,.lobby-form button,.lobby-copy-mint{min-height:48px;border:1px solid var(--line);border-radius:10px;background:rgba(0,0,0,.35);color:var(--paper);font:inherit;padding:0 12px}
  .lobby-form button,.lobby-copy-mint{background:var(--acid);color:var(--ink);border-color:var(--acid);font-weight:950;text-transform:uppercase;letter-spacing:.06em;cursor:pointer}
  .lobby-form button:hover,.lobby-copy-mint:hover{filter:brightness(1.05)}
  .lobby-form button:disabled{opacity:.55;cursor:not-allowed;filter:none}
  .lobby-copy-mint{min-height:28px;padding:4px 10px;font-size:11px;margin:0 2px;vertical-align:middle}
  .lobby-count{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.04em}
  .lobby-body a{color:var(--acid);font-weight:800;text-underline-offset:3px}
  .lobby-note{margin:0;font-size:13px;color:var(--muted);line-height:1.45}
  .lobby-xbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
  .lobby-x-status{flex:1;min-width:12rem;line-height:1.4;color:var(--muted)}
  .lobby-x-btn,.lobby-x-unlink{min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:999px;background:rgba(29,155,240,.2);color:var(--paper);font:inherit;font-weight:800;font-size:11px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
  .lobby-x-btn:hover,.lobby-x-unlink:hover{filter:brightness(1.1)}
  .lobby-x-btn:disabled{opacity:.5;cursor:not-allowed}
  .lobby-linked .lobby-meta{color:var(--hot)}
  .lobby-holder-badge{display:inline-flex;align-items:center;margin-left:6px;padding:2px 6px;border:1px solid var(--acid);border-radius:999px;color:var(--acid);font-size:10px;font-weight:900;letter-spacing:.04em;text-transform:uppercase}
  .lobby-nick[readonly]{opacity:.9;border-color:rgba(29,155,240,.45)}
  .lobby-line{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:start}
  .lobby-line .lobby-meta{grid-column:1/-1}
  .lobby-presence{margin:0;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--acid)}
  .lobby-nfa{margin:0;font-size:12px;line-height:1.45;color:var(--muted)}
  .lobby-tools{display:flex;justify-content:flex-end;gap:8px;margin:0}
  .lobby-expand-btn{min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.06);color:var(--paper);font:inherit;font-weight:800;font-size:11px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
  .lobby-expand-btn:hover{border-color:var(--acid);color:var(--acid)}
  .lobby-expand-btn:focus-visible{outline:3px solid var(--acid);outline-offset:2px}
  .dasha-lobby.lobby-expanded{position:fixed;inset:12px;z-index:80;max-width:none;width:auto;height:auto;margin:0;padding:16px;border-radius:16px;background:rgba(7,6,8,.97);border:2px solid var(--acid);box-shadow:0 20px 60px rgba(0,0,0,.55);display:grid;grid-template-rows:auto auto auto auto auto auto minmax(0,1fr) auto;gap:10px}
  .dasha-lobby.lobby-expanded .lobby-log{max-height:none;min-height:0;height:100%}
  .dasha-lobby.lobby-expanded .lobby-form{margin-top:0}
  html.lobby-expanded-open,body.lobby-expanded-open{overflow:hidden}
  .dasha-lobby.lobby-expanded{inset:0;border-radius:0;border-width:0 0 0 0;padding:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
  .lobby-pin-body{margin:0;font-size:14px;line-height:1.45;color:var(--paper);padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:rgba(0,0,0,.25)}
  .lobby-empty{margin:auto;padding:24px 12px;text-align:center;color:var(--muted);font-size:15px;line-height:1.5;max-width:28ch}
  .lobby-line-actions{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
  .lobby-copy-line,.lobby-remix,.lobby-report{font-size:11px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--acid);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px;white-space:nowrap;font:inherit}
  .lobby-report{color:var(--muted)}
  .lobby-avatar{width:16px;height:16px;border-radius:999px;vertical-align:middle;margin-right:6px;object-fit:cover}
  .lobby-handle{color:inherit;text-decoration:none}
  .lobby-handle:hover{text-decoration:underline;text-underline-offset:3px}
  .lobby-form{grid-template-columns:1fr}
  .lobby-form button{width:100%}
  .lobby-copy-mint{min-height:44px}
  .micro,.seed-intro,.buy-warning,.buy-plugin-note,.simp-privacy,.oss-lede,.lobby-lede{color:var(--paper)}
  .lobby-mint{user-select:all}
  .lobby-log{max-height:340px;padding:14px;gap:12px;scroll-behavior:smooth}
  .lobby-line{grid-template-columns:1fr;gap:3px;line-height:1.4}
  .lobby-line .lobby-meta{grid-column:auto}
  .lobby-form{grid-template-columns:minmax(100px,120px) minmax(0,1fr) auto}
  .lobby-status{min-height:1.3em;padding:0 2px}
  .micro,.seed-intro,.source-note,.ca-hint,.buy-warning,.lobby-status,.lobby-meta,.lobby-count,.lobby-note,.lobby-xbar,.lobby-nfa,.lobby-empty,.simp-status,.simp-privacy,.simp-basis,.simp-pts,.simp-me,.simp-season,.lede-mini,.oss-lede,.endband p,footer,footer p{color:var(--muted)}
  .lobby-form{grid-template-columns:minmax(0,1fr) auto}
  .lobby-form .lobby-field:first-child{grid-column:1/-1}
  .lobby-form button{width:auto}

  /* One room. Desktop: threads (durable) + now (live). Phone: Discord-style tabs so two
     scrollers never fight. Research: forum posts need titles; chat is the stay-loop. */
  .lp-tabs{display:none;gap:6px;padding:8px clamp(14px,3vw,26px) 0;background:rgba(7,6,8,.92)}
  .lp-tab{min-height:44px;min-width:44px;flex:1 1 0;padding:0 12px;border:1px solid var(--line);
    border-radius:999px;background:transparent;color:var(--paper);font:inherit;font-weight:900;
    font-size:12px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
  .lp-tab[aria-selected=true]{background:var(--acid);color:var(--ink);border-color:var(--acid)}
  .lp-tab:focus-visible{outline:3px solid var(--acid);outline-offset:2px}
  .lp-hold{flex:1 1 auto;display:grid;min-height:0;gap:clamp(12px,2vw,22px);
    grid-template-columns:minmax(0,1.45fr) minmax(320px,.85fr);
    padding:0 clamp(0px,2vw,26px) 0;max-width:1400px;width:100%;margin:0 auto}
  @media (max-width:960px){
    .lp-tabs{display:flex}
    .lp-hold{grid-template-columns:minmax(0,1fr)}
    .lp-hold[data-pane=now] #dasha-forum{display:none!important}
    .lp-hold[data-pane=threads] #dasha-lobby{display:none!important}
    .lp-hold[data-pane=threads] #dasha-forum{min-height:0;height:100%}
  }

  /* Forum */
  #dasha-forum{min-width:0;display:flex;flex-direction:column;min-height:0;overflow-y:auto;
    padding:18px 4px 40px;scrollbar-width:thin}
  .df-status{margin:0 0 10px;min-height:1.3em;font-size:13px;font-weight:700;color:var(--muted)}
  .df-head{margin:0 0 18px}
  .df-title{margin:0 0 6px;font-size:clamp(26px,4vw,40px);line-height:1.05;letter-spacing:-.04em;font-weight:950}
  .df-note{margin:0;font-size:14px;line-height:1.5;color:var(--muted);max-width:56ch}
  .df-list{display:flex;flex-direction:column;gap:10px}
  .df-row{padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.045);display:flex;align-items:center;gap:10px}
  .df-row:hover{border-color:var(--acid)}
  .df-row-main{min-width:0;flex:1 1 auto}
  .df-open{display:block;width:100%;min-height:44px;padding:0;border:0;background:none;color:var(--paper);
    font:inherit;font-size:17px;font-weight:900;line-height:1.3;letter-spacing:-.01em;text-align:left;text-decoration:none;cursor:pointer}
  .df-open:hover{color:var(--acid)}
  .df-avatar{width:26px;height:26px;border-radius:999px;object-fit:cover;flex:0 0 auto;background:rgba(255,255,255,.08)}
  .df-meta{margin:4px 0 0;font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:6px}
  .df-author{color:inherit;text-underline-offset:2px}
  .df-meta .df-avatar{width:16px;height:16px}
  .df-new{flex:0 0 auto;padding:2px 8px;border-radius:999px;background:var(--acid);color:var(--ink);font-size:10px;font-weight:950;letter-spacing:.08em}
  .df-snippet{margin:6px 0 0;font-size:13px;line-height:1.45;color:var(--muted);overflow-wrap:anywhere}
  .df-newcount{margin:0 0 6px;font-size:13px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--acid)}
  .df-empty{margin:0;padding:26px 4px;color:var(--muted);font-size:15px}
  .df-posts{display:flex;flex-direction:column;gap:12px;margin:16px 0 20px}
  .df-post{padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:rgba(0,0,0,.28)}
  .df-post:target{border-color:var(--acid);background:rgba(223,255,0,.07)}
  .df-body{margin:6px 0 0;font-size:15px;line-height:1.55;overflow-wrap:anywhere}
  .df-body a{color:var(--acid);font-weight:800;text-underline-offset:3px}
  .df-quote{margin:8px 0 0;padding:8px 12px;border-left:3px solid var(--acid);background:rgba(223,255,0,.07);border-radius:0 8px 8px 0;font-size:14px;line-height:1.5;color:var(--muted);overflow-wrap:anywhere}
  .df-quote-handle{font-weight:900;color:var(--paper)}
  .df-reply-wrap{display:grid;gap:8px}
  .df-quote-chip{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border:1px solid var(--acid);border-radius:10px;background:rgba(223,255,0,.1);color:var(--paper);font-size:14px;line-height:1.45}
  .df-quote-chip-label{min-width:0;overflow-wrap:anywhere}
  .df-chip-x{flex:0 0 auto;min-width:32px;min-height:32px;padding:0 10px;border:1px solid var(--line);border-radius:999px;background:rgba(0,0,0,.35);color:var(--paper);font:inherit;font-size:16px;line-height:1;cursor:pointer}
  .df-chip-x:hover{border-color:var(--acid);color:var(--acid)}
  .df-tools{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
  .df-back{min-height:44px;padding:0 14px;margin:0;border:1px solid var(--line);border-radius:999px;
    background:rgba(255,255,255,.06);color:var(--paper);font:inherit;font-weight:800;font-size:12px;
    letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
  .df-back:hover{border-color:var(--acid);color:var(--acid)}
  .df-share-link{min-height:44px;min-width:0;flex:1 1 14rem;padding:0 12px;border:1px solid var(--acid);
    border-radius:10px;background:rgba(0,0,0,.35);color:var(--paper);font:inherit;user-select:all}
  .df-composer{display:grid;gap:10px;margin:0 0 22px;padding:16px;border:1px solid var(--line);
    border-radius:12px;background:rgba(124,77,255,.09)}
  .df-field{display:grid;gap:5px;min-width:0}
  .df-label{font-size:12px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .df-composer input,.df-composer textarea{min-height:48px;padding:12px;border:1px solid var(--line);
    border-radius:10px;background:rgba(0,0,0,.35);color:var(--paper);font:inherit;resize:vertical}
  .df-send{min-height:48px;justify-self:start;padding:0 22px;border:1px solid var(--acid);border-radius:999px;
    background:var(--acid);color:var(--ink);font:inherit;font-weight:950;text-transform:uppercase;
    letter-spacing:.06em;cursor:pointer}
  .df-send:hover{filter:brightness(1.05)}
  .df-send:disabled{opacity:.55;cursor:not-allowed;filter:none}
  .df-editform{display:grid;gap:10px;margin:8px 0 0}
  .df-editform textarea{min-height:90px;padding:12px;border:1px solid var(--acid);border-radius:10px;background:rgba(0,0,0,.35);color:var(--paper);font:inherit;resize:vertical}
  .df-report-form{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 0}
  .df-report-form select{min-height:44px;padding:0 12px;background:#0d0b0f;color:var(--paper);border:1px solid var(--line);border-radius:10px;font:inherit;font-weight:800}
  #dasha-forum :focus-visible{outline:3px solid var(--acid);outline-offset:3px}

  /* The chat keeps its column. */
  #dasha-lobby{flex:1 1 auto;display:flex;flex-direction:column;min-height:0;width:100%;
    max-width:920px;margin:0 auto;border-left:1px solid var(--line)}
  /* Stacked, the chat gets a full screen of its own rather than a bounded strip under the forum.
     Capping it to ~60vh was the first attempt and it rebuilt the cramped box the chat was moved off
     the homepage to escape — dasha-lobby-page.test.mjs measures the log against the viewport and
     caught it at 29%. This has to sit after the #dasha-lobby rule above, which sets min-height:0 at
     equal specificity; declared before it, the override silently lost the cascade. */
  @media (max-width:960px){
    #dasha-lobby{border-left:0;border-top:1px solid var(--line);min-height:0;height:100%}
  }
  #dasha-lobby .lobby-body{flex:1 1 auto;display:flex;flex-direction:column;min-height:0}
  /* The message list is the page's scroller, not a box inside a page that also scrolls. */
  #dasha-lobby .lobby-log{flex:1 1 auto;min-height:0;max-height:none;overflow-y:auto;
    padding:16px 14px;scrollbar-width:thin}
  #dasha-lobby .lobby-form{position:sticky;bottom:0;background:rgba(7,6,8,.94);
    backdrop-filter:blur(8px);padding:12px 14px calc(12px + env(safe-area-inset-bottom));
    border-top:1px solid var(--line)}
  #dasha-lobby .lobby-text{min-height:48px}
  #dasha-lobby .lobby-send{min-height:48px}

  /* Gone, not hidden-and-forgotten: there is nothing to expand into on a page that is already the
     chat. If the client ever stops shipping this button, nothing here breaks. */
  #dasha-lobby .lobby-expand-btn{display:none!important}

  /* The client still renders an obsolete disclaimer strip. Remove it at the client source when
     that tree is next changed; hiding it here also returns 48px to the conversation. */
  #dasha-lobby .lobby-nfa{display:none!important}

  /* Chrome around the conversation, tightened. Every row here was sized for a chat sitting in a
     homepage section; on a page that is only the chat, they were spending a third of the viewport
     on furniture. */
  #dasha-lobby .lobby-pin,#dasha-lobby .lobby-xbar{padding:8px 14px;font-size:13px}
  #dasha-lobby .lobby-presence,#dasha-lobby .lobby-status{padding:2px 14px;font-size:12px;line-height:1.35}
  #dasha-lobby .lobby-form{padding:10px 14px calc(10px + env(safe-area-inset-bottom))}
  #dasha-lobby .lobby-tools{gap:8px}

  @media (max-width:600px){.lp-hold{padding:0}}

  /* Reduced motion. The other two surfaces carry this and the lobby did not, which was a real gap
     before any of it moved: a sticky header and a scrolling chat are motion whether or not anyone
     wrote a keyframe, and smooth scrolling is the part that actually makes people ill. */
  @media(prefers-reduced-motion:reduce){
    html{scroll-behavior:auto}
    #dasha-lobby-page *,#dasha-lobby-page *::before,#dasha-lobby-page *::after{
      animation-duration:.01ms!important;animation-iteration-count:1!important;
      transition-duration:.01ms!important;scroll-behavior:auto!important}
  }
</style>

<div id="dasha-lobby-page">
  <a class="skip-link" href="#dasha-lobby">Skip to now</a>
  <header class="lp-top">
    <a class="lp-back" href="/">← $dasha</a>
    <span class="lp-id"><h1>$<span>dasha</span> room</h1></span>
    <p class="lp-room">Now + threads. Official. No Telegram. No Discord.</p>
  </header>
  <main>
  <div class="lp-tabs" role="tablist" aria-label="Room">
    <button class="lp-tab" type="button" id="tab-now" role="tab" aria-controls="dasha-lobby" aria-selected="true">Now</button>
    <button class="lp-tab" type="button" id="tab-threads" role="tab" aria-controls="dasha-forum" aria-selected="false">Threads</button>
  </div>

  <div class="lp-hold" data-pane="now">
    <div id="dasha-forum" role="tabpanel" aria-labelledby="tab-threads"></div>
    <div id="dasha-lobby" role="tabpanel" aria-labelledby="tab-now" data-lobby-url="wss://lobby.getdasha.com/ws"></div>
  </div>
  </main>
</div>
<script>
(function(){
  var hold=document.querySelector('.lp-hold');
  if(!hold)return;
  var now=document.getElementById('tab-now');
  var th=document.getElementById('tab-threads');
  function wanted(){
    try{
      var q=new URLSearchParams(location.search);
      if(q.get('pane')==='threads'||q.get('t'))return 'threads';
      var h=String(location.hash||'').toLowerCase();
      if(h==='#threads'||h==='#forum')return 'threads';
    }catch(e){}
    return 'now';
  }
  function set(p,push){
    hold.setAttribute('data-pane',p);
    if(now)now.setAttribute('aria-selected',p==='now'?'true':'false');
    if(th)th.setAttribute('aria-selected',p==='threads'?'true':'false');
    if(!push)return;
    try{
      var u=new URL(location.href);
      if(p==='threads'&&!u.searchParams.get('t'))u.hash='threads';
      else if(p==='now')u.hash='';
      history.replaceState(null,'',u.pathname+u.search+u.hash);
    }catch(e){}
  }
  set(wanted(),false);
  if(now)now.addEventListener('click',function(){set('now',true)});
