<style>
:root{--ink:#070608;--paper:#f4eddb;--acid:#dfff00;--hot:#ff3b81;--line:rgba(244,237,219,.32);--muted:#e6dcc4}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--ink);color:var(--paper);font-family:Arial,Helvetica,sans-serif}body{background:radial-gradient(circle at 80% 5%,rgba(124,77,255,.35),transparent 32rem),var(--ink)}a{color:inherit}.shell{width:min(760px,calc(100% - 32px));margin:auto}.nav{min-height:72px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{min-height:44px;display:inline-flex;align-items:center;font-size:22px;font-weight:950;letter-spacing:-1px;text-decoration:none}.brand span{color:var(--acid)}.back{min-height:44px;display:inline-flex;align-items:center;font-size:12px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;text-underline-offset:4px}main{padding:32px 0 max(32px,env(safe-area-inset-bottom))}.dasha-lobby{display:grid;gap:8px}.lobby-pin{font-size:13px;line-height:1.5;color:var(--muted)}.lobby-pin strong{color:var(--acid);letter-spacing:.08em;text-transform:uppercase}.lobby-mint{font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--paper);user-select:all}.lobby-pin-body{margin:0;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:rgba(0,0,0,.25);font-size:14px;line-height:1.45}.lobby-nfa,.lobby-status,.lobby-presence,.lobby-empty,.lobby-count{margin:0;color:var(--muted);font-size:12px;line-height:1.45}.lobby-status{min-height:1.3em;padding:0 2px;font-size:14px;font-weight:700}.lobby-status[data-kind=ok],.lobby-presence{color:var(--acid)}.lobby-status[data-kind=bad]{color:var(--hot)}.lobby-status[data-kind=warn]{color:#ffc857}.lobby-presence{font-weight:800;letter-spacing:.08em;text-transform:uppercase}.lobby-xbar,.lobby-tools{display:flex;align-items:center;gap:8px}.lobby-xbar{flex-wrap:wrap;color:var(--muted);font-size:13px}.lobby-x-status{flex:1;min-width:12rem}.lobby-tools{justify-content:flex-end}.lobby-x-btn,.lobby-x-unlink,.lobby-expand-btn{min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.06);color:var(--paper);font:800 11px Arial,Helvetica,sans-serif;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}.lobby-x-btn{background:rgba(29,155,240,.2)}.lobby-log{min-height:360px;max-height:55vh;overflow:auto;display:flex;flex-direction:column;gap:12px;padding:14px;border:1px solid var(--line);border-radius:10px;background:rgba(0,0,0,.35);scroll-behavior:smooth}.lobby-line{display:grid;gap:3px;font-size:15px;line-height:1.4}.lobby-meta{color:var(--muted);font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}.lobby-chat .lobby-meta{color:var(--acid)}.lobby-body{overflow-wrap:anywhere}.lobby-body a{color:var(--acid);font-weight:800;text-underline-offset:3px}.lobby-avatar{width:16px;height:16px;margin-right:6px;border-radius:999px;vertical-align:middle;object-fit:cover}.lobby-handle{text-decoration:none}.lobby-empty{margin:auto;padding:28px 14px;text-align:center;font-size:15px;display:grid;gap:10px;justify-items:center}.lobby-empty-title{margin:0;color:var(--paper);font-size:18px;font-weight:950}.lobby-empty-hint{margin:0;font-size:14px;line-height:1.4;max-width:22rem}.lobby-empty-actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}.lobby-empty-cta{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--acid);background:var(--acid);color:var(--ink);font:950 11px Arial,Helvetica,sans-serif;letter-spacing:.06em;text-transform:uppercase;text-decoration:none!important}.lobby-empty-cta.ghost{border-color:var(--line);background:transparent;color:var(--paper)}.lobby-form{display:grid;grid-template-columns:minmax(100px,120px) minmax(0,1fr) auto;gap:8px;align-items:start}.lobby-field{display:grid;gap:4px;min-width:0}.lobby-form input,.lobby-send{min-height:48px;border:1px solid var(--line);border-radius:10px;background:rgba(0,0,0,.35);color:var(--paper);font:inherit;padding:0 12px}.lobby-send{background:var(--acid);border-color:var(--acid);color:var(--ink);font-weight:950;text-transform:uppercase;letter-spacing:.06em;cursor:pointer}.lobby-send:disabled{opacity:.55}.dasha-lobby.lobby-expanded{position:fixed;inset:12px;z-index:80;padding:16px;background:rgba(7,6,8,.98);border:2px solid var(--acid);border-radius:16px;display:grid;grid-template-rows:auto auto auto auto auto auto minmax(0,1fr) auto}.dasha-lobby.lobby-expanded .lobby-log{height:100%;max-height:none;min-height:0}html.lobby-expanded-open,body.lobby-expanded-open{overflow:hidden}:focus-visible{outline:3px solid var(--acid);outline-offset:3px}@media(max-width:640px){.shell{width:min(100% - 22px,760px)}main{padding-top:18px}.lobby-log{min-height:46vh;max-height:58vh}.lobby-form{grid-template-columns:minmax(0,1fr) auto}.lobby-form .lobby-field:first-child{grid-column:1/-1}.dasha-lobby.lobby-expanded{inset:0;padding:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom));border:0;border-radius:0}}@media(prefers-reduced-motion:reduce){.lobby-log{scroll-behavior:auto}}
