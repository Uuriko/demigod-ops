<script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"What is Demigod?","acceptedAnswer":{"@type":"Answer","text":"Demigod matches SF Bay startups and talent with software — humans in the loop. Share a brief or profile; we propose only strong fits. 10% of first-year cash on hire. Talent free."}},{"@type":"Question","name":"What happens after I submit?","acceptedAnswer":{"@type":"Answer","text":"Demigod tech ranks your brief or profile; humans in the loop review. If a fit looks real, both sides approve before intro. potter@trydemigod.com follows up."}},{"@type":"Question","name":"How is matching different from open listing sites?","acceptedAnswer":{"@type":"Answer","text":"There is no public job feed or application blast. Humans curate. Your profile is not circulated without a real fit and both sides approving the intro."}},{"@type":"Question","name":"How much does it cost?","acceptedAnswer":{"@type":"Answer","text":"Startups: 10% of first-year cash salary when someone starts. Nothing upfront. Talent: always free. Typical agencies often charge more."}},{"@type":"Question","name":"Is my profile private?","acceptedAnswer":{"@type":"Answer","text":"Yes. Identity and contact details move only after both sides approve an intro. You can ask us to update or delete data anytime."}},{"@type":"Question","name":"What is a 90-day outcome?","acceptedAnswer":{"@type":"Answer","text":"One measurable result the hire must deliver in their first 90 days. We match against that outcome — not a keyword soup or generic JD."}},{"@type":"Question","name":"Who do you work with?","acceptedAnswer":{"@type":"Answer","text":"SF Bay Area startups (and builders open to those companies). Seed through growth, product and eng-heavy roles first. Remote talent is fine when the company is Bay-focused."}},{"@type":"Question","name":"How long does it take?","acceptedAnswer":{"@type":"Answer","text":"No SLA clock. Timing depends on role difficulty and response pace. Every brief gets careful human review — potter@trydemigod.com follows up."}},{"@type":"Question","name":"Are payments and SMS live?","acceptedAnswer":{"@type":"Answer","text":"Not yet. Commercial confirmations and follow-ups are by email (potter@trydemigod.com). Stripe and Twilio are pending — we say so honestly on the site."}},{"@type":"Question","name":"Do you auto-message founders or candidates?","acceptedAnswer":{"@type":"Answer","text":"No auto-DM blasts. Humans send outreach. The site is for inbound briefs, profiles, and transparent product pages."}},{"@type":"Question","name":"What if a match is not right?","acceptedAnswer":{"@type":"Answer","text":"Pass privately. No pressure, no public rejection trail. If evidence is thin, we say so instead of manufacturing a shortlist."}},{"@type":"Question","name":"Can I partner or refer talent?","acceptedAnswer":{"@type":"Answer","text":"Yes. Approved individual referrers can earn 20% of Demigod's net placement fee after a referred hire completes 90 days and the related client fee is paid and retained. Approved hiring partners receive company credits, not personal cash. Written terms apply; payout tooling is pending."}},{"@type":"Question","name":"What roles do you cover first?","acceptedAnswer":{"@type":"Answer","text":"Product, engineering, design, and GTM for SF Bay startups. Other roles case-by-case when the 90-day outcome is clear."}},{"@type":"Question","name":"What do I need to submit as a founder?","acceptedAnswer":{"@type":"Answer","text":"Company, stage, role, must-haves, one measurable 90-day outcome, work arrangement, base cash band, and how soon you need someone. Comp bands keep matching honest."}},{"@type":"Question","name":"What do I need as talent?","acceptedAnswer":{"@type":"Answer","text":"Name, email, strengths, work highlights, Bay Area openness, availability, base cash band, US work authorization, and one resume or work link. Free forever — outreach only on real fits."}},{"@type":"Question","name":"How do intros work?","acceptedAnswer":{"@type":"Answer","text":"When both sides approve, we send a warm intro email. No cold LinkedIn spam from us. You take it from there."}},{"@type":"Question","name":"Where can I read updates?","acceptedAnswer":{"@type":"Answer","text":"See Notes for short product and market posts. Each note has its own shareable link. Questions: potter@trydemigod.com."}}]}</script>
